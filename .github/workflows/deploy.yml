name: Build and Push to Azure

on:
  push:
    branches: [ main ] 

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v2
      with:
        login-server: ${{ secrets.ACR_NAME }}.azurecr.io
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and push client image
      run: |
        docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/client:latest -f 5/client/Dockerfile 5/client
        docker push ${{ secrets.ACR_NAME }}.azurecr.io/client:latest

    - name: Build and push server image
      run: |
        docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/server:latest -f 5/server/Dockerfile 5/server
        docker push ${{ secrets.ACR_NAME }}.azurecr.io/server:latest

    - name: Send mail on success
      if: success()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.MAIL_USERNAME }}
        password: ${{ secrets.MAIL_PASSWORD }}
        subject: "Build Successful"
        to: ${{ secrets.MAIL_USERNAME }}
        from: GitHub Actions
        body: "The application was successfully built and pushed to ACR."